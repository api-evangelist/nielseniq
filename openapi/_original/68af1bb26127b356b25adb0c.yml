      summary: Gets details for the model specified by the given modelId.
      operationId: 688cd23dbe4114127cd8748f
      parameters:
        - name: model-id
          in: path
          description: The identifier of the model.
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: The requested API version.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json: { }
        '400':
          description: An error occurred.
