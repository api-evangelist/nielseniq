openapi: 3.2.0
info:
  title: Translation Service US Azure OpenAI Service Uploads API
  description: Azure OpenAI APIs for completions and search
  version: '1.0'
servers:
- url: https://api.developer.nielseniq.com/cis/us/translation/openai
tags:
- name: Uploads
paths:
  /uploads:
    post:
      summary: An intermediate Upload object is created, allowing you to add Parts to it.
      operationId: 688cd23dbe4114127cd87490
      parameters:
      - name: api-version
        in: query
        description: The requested API version.
        required: true
        schema:
          type: string
      requestBody:
        description: The definition of the file to create including its purpose and the location on the local machine.
        content:
          application/json: {}
      responses:
        '200':
          description: The upload has been successfully created.
          content:
            application/json: {}
        '400':
          description: An error occurred.
          content:
            application/json: {}
      tags:
      - Uploads
  /uploads/{upload-id}/parts:
    post:
      summary: Adds a Part to an Upload object, where each Part represents a segment of the…
      operationId: 688cd23dbe4114127cd87491
      parameters:
      - name: upload-id
        in: path
        description: The identifier of the upload.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json: {}
        '400':
          description: An error occurred.
          content:
            application/json: {}
      tags:
      - Uploads
  /uploads/{upload-id}/complete:
    post:
      summary: This completes the Upload, and the returned Upload object contains a nested…
      operationId: 688cd23dbe4114127cd87492
      parameters:
      - name: upload-id
        in: path
        description: The identifier of the upload.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version.
        required: true
        schema:
          type: string
      requestBody:
        description: The definition of the file to create including its purpose and the location on the local machine.
        content:
          application/json:
            example:
              part_ids:
              - string
              md5: string
      responses:
        '200':
          description: Success
          content:
            application/json: {}
        '400':
          description: An error occurred.
          content:
            application/json: {}
      tags:
      - Uploads
  /uploads/{upload-id}/cancel:
    post:
      summary: Cancels the Upload, and will lead to all uploaded parts to be deleted…
      operationId: 688cd23dbe4114127cd87493
      parameters:
      - name: upload-id
        in: path
        description: The identifier of the upload.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json: {}
        '400':
          description: An error occurred.
          content:
            application/json: {}
      tags:
      - Uploads
