openapi: 3.2.0
info:
  title: Nielseniq Rdecosystem Controller API
  version: '1.0'
  description: 'Operations tagged rdecosystem-controller across 2 of this provider''s published API definitions: Rdecosystem.yml, nielseniq-rdecosystem-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.developer.nielseniq.com/rdecosystem
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: rdecosystem-controller
  description: RDecoSystem Controller
paths:
  /rddispatch:
    get:
      tags:
      - rdecosystem-controller
      summary: getRdDispatchResp
      operationId: getRdDispatchRespUsingGET
      parameters:
      - name: page
        in: query
        description: page
        schema:
          type: string
      - name: size
        in: query
        description: size
        schema:
          type: string
      - name: fromDate
        in: query
        description: fromDate
        schema:
          type: string
      - name: endDate
        in: query
        description: endDate
        schema:
          type: string
      - name: provider
        in: query
        description: provider
        schema:
          type: string
      - name: Authorization
        in: header
        description: Authorization
        required: true
        schema:
          type: string
      - name: subscription-key
        in: header
        description: subscription-key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdDispatchResp'
              example:
                user:
                - nielsenExternalCode: string
                  dispatchDate: string
                  dispatchId: string
                  commodityGroup: string
                  images:
                  - imgId: string
                    imgUrl: string
                    imgSourcedDate: string
                  imageSource: string
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not found
          content:
            application/json: {}
        '500':
          description: Failure
          content:
            application/json: {}
    servers:
    - url: https://api.developer.nielseniq.com/rdecosystem
  /rdimagedispatch:
    get:
      tags:
      - rdecosystem-controller
      summary: getRdimageDispatchResp
      operationId: getRdimageDispatchRespUsingGET
      parameters:
      - name: imgId
        in: query
        description: imgId
        schema:
          type: string
      - name: subscription-key
        in: header
        description: subscription-key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/RdecosystemRdimagedispatchGet200ImagePngResponse'
              example: ''
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not found
          content:
            application/json: {}
        '500':
          description: Failure
          content:
            application/json: {}
    servers:
    - url: https://api.developer.nielseniq.com/rdecosystem
  /rejectImage:
    post:
      tags:
      - rdecosystem-controller
      summary: rejectImageResp
      operationId: rejectImageRespUsingPOST
      parameters:
      - name: Authorization
        in: header
        description: Authorization
        required: true
        schema:
          type: string
      - name: subscription-key
        in: header
        description: subscription-key
        required: true
        schema:
          type: string
      requestBody:
        description: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rejectImageRequest'
            example:
              dispatchStatus: string
              dateEntered: string
              dispatchId: string
              nielsenExternalCode: string
              rejectedReason: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rejectImageResp'
              example: string
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not found
          content:
            application/json: {}
        '500':
          description: Failure
          content:
            application/json: {}
    servers:
    - url: https://api.developer.nielseniq.com/rdecosystem
  /rddispatch/icv/nankey/{id}:
    get:
      tags:
      - rdecosystem-controller
      summary: getRdICVDispatchforNanKeyResp
      operationId: getRdICVDispatchforNanKeyRespUsingGET
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: size
        in: query
        description: Page Size
        schema:
          type: integer
          default: 20
      - name: provider
        in: query
        description: Data provider
        schema:
          type: string
      - name: Authorization
