name: NielsenIQ MCP
type: MCPServer
generated: '2026-10-18'
method: searched
source:
- https://nielseniq.com/global/en/legal/niq-connect-ai-terms-and-conditions/
- https://nielseniq.com/global/en/products/optiq/
- https://nielseniq.com/global/en/news-center/2026/niq-deployco-consumer-intelligence-enterprise-workflows/
official_server:
  name: NIQ Optiq Bridge (MCP Connector)
  exists: true
  evidence: 'NIQ ConnectAI Terms and Conditions (HTTP 200, fetched 2026-10-18): "“Optiq Bridge” (MCP Connector) means NIQ’s
    branded implementation of a Model Context Protocol (MCP) server enabling Authorized AI Platforms to connect to Optiq and
    to submit prompts or queries to, and receive Output from, Optiq programmatically via API access." Authorized AI Platforms
    are listed as Microsoft Copilot, OpenAI ChatGPT, Google Gemini and Anthropic Claude.'
  evidence_url: https://nielseniq.com/global/en/legal/niq-connect-ai-terms-and-conditions/
  access: Contracted enterprise product (Optiq Suite, under an SOW); usable only through NIQ-approved authentication and within
    NIQ rate limits (Terms §8.7).
  availability: NIQ newsroom (2026) says expanded Optiq Bridge versions were scheduled for early September 2026.
  endpoint_published: false
  tools_published: false
  note: 'NIQ publishes no endpoint URL, no tool list and no install package. Probes on 2026-10-18: portal.developer.nielseniq.com/.well-known/mcp.json
    -> 404; mcp.nielseniq.com did not resolve (connection failed, status 000). Optiq Bridge queries Optiq (the Discover conversational
    layer), not the Azure API Management APIs in openapi/.'
deployment:
  mode: none
  auth: unknown
  verified: searched
  note: An official MCP server (Optiq Bridge) exists, but NIQ publishes no endpoint, so no remote endpoint is recorded. The
    tools below are a candidate list DERIVED from the OpenAPI contracts; nobody ships them.
