          in: header
          description: clientEmail
          required: true
          schema:
            type: string
        - name: apiKey
          in: header
          description: apiKey
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: content-type
          required: true
          schema:
            type: string
        - name: subscription-key
          in: header
          description: subscription-key
          required: true
