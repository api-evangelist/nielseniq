  /uploads:
    post:
      summary: "An intermediate Upload object is created, allowing you to add Parts to it. Currently, an Upload size can be a maximum of 9 GB in total and will expire two hours after being created.\r\nAfter the Upload is completed a File object will be generated, containing all the uploaded parts. This File object ca"
      operationId: 688cd23dbe4114127cd87490
      parameters:
        - name: api-version
          in: query
          description: The requested API version.
          required: true
          schema:
            type: string
      requestBody:
        description: The definition of the file to create including its purpose and the location on the local machine.
        content:
          application/json: { }
      responses:
        '200':
          description: The upload has been successfully created.
          content:
            application/json: { }
        '400':
          description: An error occurred.
          content:
            application/json: { }
  '/uploads/{upload-id}/parts':
    post:
      summary: "Adds a Part to an Upload object, where each Part represents a segment of the file you are uploading.\r\nEach Part can be up to the standard size limit for file upload, based on the File Purpose. You can continue adding Parts until reaching the Upload size limit of 9 GB."
      operationId: 688cd23dbe4114127cd87491
      parameters:
        - name: upload-id
          in: path
          description: The identifier of the upload.
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: The requested API version.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json: { }
        '400':
          description: An error occurred.
          content:
            application/json: { }
  '/uploads/{upload-id}/complete':
    post:
      summary: "This completes the Upload, and the returned Upload object contains a nested File object that is ready for use across the platform.\r\nYou can define the order of the Parts by providing an ordered list of Part IDs.\r\nThe total number of bytes uploaded must match the size originally specified when creati"
      operationId: 688cd23dbe4114127cd87492
      parameters:
        - name: upload-id
          in: path
          description: The identifier of the upload.
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: The requested API version.
          required: true
          schema:
            type: string
      requestBody:
        description: The definition of the file to create including its purpose and the location on the local machine.
        content:
          application/json:
            example:
              part_ids:
                - string
              md5: string
      responses:
        '200':
          description: Success
          content:
            application/json: { }
        '400':
          description: An error occurred.
          content:
            application/json: { }
  '/uploads/{upload-id}/cancel':
    post:
      summary: "Cancels the Upload, and will lead to all uploaded parts to be deleted asynchronously.\r\nNo Parts may be added after an Upload is cancelled."
      operationId: 688cd23dbe4114127cd87493
      parameters:
        - name: upload-id
          in: path
          description: The identifier of the upload.
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: The requested API version.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json: { }
        '400':
          description: An error occurred.
          content:
            application/json: { }
  '/deployments/{deployment-id}/images/generations':
    post:
      summary: Generates a batch of images from a text caption on a given DALLE model deployment
      description: Generates a batch of images from a text caption on a given DALLE model deployment
      operationId: 688cd23dbe4114127cd87494
      parameters:
        - name: deployment-id
          in: path
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              prompt: a corgi in a field
              n: 1
              size: 1024x1024
              response_format: url
              user: user123456
              quality: standard
              style: vivid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              example:
