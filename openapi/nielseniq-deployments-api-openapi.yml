  /deployments/{deployment-id}/audio/translations:
    post:
      summary: Transcribes and translates input audio into English text
      description: Transcribes and translates input audio into English text.
      operationId: 688cd23dbe4114127cd87495
      parameters:
      - name: deployment-id
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                prompt:
                  type: string
                response_format:
                  enum:
                  - json
                  - text
                  - srt
                  - verbose_json
                  - vtt
                  type: string
                  description: AudioResponseFormat
                temperature:
                  enum:
                  - '0'
                  type: string
                  default: '0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                text: string
            text/plain: {}
      tags:
      - Deployments
  /deployments/{deployment-id}/audio/transcriptions:
    post:
      summary: Transcribes audio into the input language
      description: Transcribes audio into the input language.
      operationId: 688cd23dbe4114127cd87496
      parameters:
      - name: deployment-id
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                prompt:
                  type: string
                response_format:
                  enum:
                  - json
                  - text
                  - srt
                  - verbose_json
                  - vtt
                  type: string
                  description: AudioResponseFormat
                temperature:
                  enum:
                  - '0'
                  type: string
                  default: '0'
                language:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                text: string
            text/plain: {}
      tags:
      - Deployments
