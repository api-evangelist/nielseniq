  /deployments/{deployment-id}/embeddings:
    post:
      summary: Get a vector representation of a given input that can be easily consumed by…
      description: Get a vector representation of a given input that can be easily consumed by machine learning models and algorithms.
      operationId: 688cd23dbe4114127cd8747e
      parameters:
      - name: deployment-id
        in: path
        description: The deployment id of the model which was deployed.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              input: {}
              user: string
              input_type: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                object: string
                model: string
                data:
                - index: 0
                  object: string
                  embedding:
                  - 0
                usage:
                  prompt_tokens: 0
                  total_tokens: 0
      tags:
      - Deployments
  /deployments/{deployment-id}/images/generations:
