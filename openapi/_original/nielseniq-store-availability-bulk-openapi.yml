openapi: 3.0.1
info:
  title: Store Availability Bulk
  description: Store Availability API provides the estimated availability of given products in retailer locations for a given distance based on the consumer location asynchronously/synchronously. It accepts up to 9K UPCs and the API response will return the availability for the provided 9k UPCs in a CSV file for asynchronous requests. Client receives a job id for asynchronous requests which can be used to track the requests and download the completed file through mft.
  version: '1.0'
servers:
  - url: https://api.developer.nielseniq.com/StoreAvailability/v3
