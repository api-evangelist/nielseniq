components:
  schemas:
    RdDispatch:
      title: RdDispatch
      type: object
      properties:
        nielsenExternalCode:
          type: string
        dispatchDate:
          type: string
        dispatchId:
          type: string
        commodityGroup:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Images'
        imageSource:
          type: string
    postCreateProductRequest:
      title: Content
      type: object
      properties:
        data:
          type: object
          items:
            $ref: '#/components/schemas/CreateProduct'
    SyndicatedChars:
      title: SyndicatedChars
      type: object
      properties:
        SyndicatedCharsObj:
          type: object
          items:
            $ref: '#/components/schemas/SyndicatedCharsObj'
    RdecosystemRdimagedispatchGet200ImagePngResponse:
      type: string
      format: binary
    RdecosystemAckRdICVdispatch:
      title: RdecosystemAckRdICVdispatch
      type: string
    RdDispatchResp:
      title: Content
      type: object
      properties:
        user:
          type: array
          items:
            $ref: '#/components/schemas/RdDispatch'
    RdecosystemRdICVdispatchResponse:
      title: Content
      type: object
      properties:
        user:
          type: array
          items:
            $ref: '#/components/schemas/RdecosystemRdICVdispatch'
        hasMoreRecords:
          type: boolean
        size:
          type: integer
    rejectImageRequest:
      title: Content
      type: object
      properties:
        dispatchStatus:
          type: string
        dateEntered:
          type: string
        dispatchId:
          type: string
        nielsenExternalCode:
          type: string
        rejectedReason:
          type: string
    RdecosystemRdICVdispatch:
      title: RdecosystemRdICVdispatch
      type: object
      properties:
        id:
          type: string
        country:
          type: string
        extrnCode:
          type: string
        nanKey:
          type: string
        gic:
          type: integer
        cntlChr:
          type: object
          items:
            $ref: '#/components/schemas/CntlChr'
        chrs:
          type: array
          items:
            $ref: '#/components/schemas/Chrs'
        itmCrtDttm:
          type: string
        itmUpdDttm:
          type: string
        updDttm:
          type: string
    CntlChr:
      title: CntlChr
      type: object
      properties:
        chrCd:
          type: integer
        chrLclCd:
          type: string
        chrDscr:
          type: string
        chrVal:
          type: object
          items:
            $ref: '#/components/schemas/ChrVal'
    rejectImageResp:
      title: Content
      type: string
    GtinFormats:
      title: GtinFormats
      type: object
      properties:
        UPC_A:
          type: string
        ON_PACK:
          type: string
        NO_CHECK_DIGIT:
          type: string
        GTIN_14:
          type: string
    ChrVal:
      title: ChrVal
      type: object
      properties:
        chrValCd:
          type: integer
        chrValLclCd:
          type: string
        chrValDscr:
          type: string
        seq:
          type: integer
    SyndicatedCharsObj:
      title: SyndicatedCharsObj
      type: object
      properties:
        characteristic:
          type: string
        value:
          type: string
    Images:
      title: Images
      type: object
      properties:
        imgId:
          type: string
        imgUrl:
          type: string
        imgSourcedDate:
          type: string
    CreateProduct:
      title: Content
      type: object
      properties:
        upc:
          type: string
        productId:
          type: integer
        gtinFormats:
          type: object
          items:
            $ref: '#/components/schemas/GtinFormats'
        syndicatedChars:
          type: array
          items:
            $ref: '#/components/schemas/SyndicatedChars'
    RdecosystemAckRdICVdispatchResponse:
      title: Content
      type: object
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/RdecosystemAckRdICVdispatch'
    Chrs:
      title: Chrs
      type: object
      properties:
        ChrsContent:
          type: object
          items:
            $ref: '#/components/schemas/CntlChr'
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: subscription-key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
x-refined-from:
- Rdecosystem.yml
- nielseniq-rdecosystem-openapi.yml
