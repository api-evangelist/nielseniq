aid: nielseniq

name: NielsenIQ

description: NielsenIQ (NIQ) is a global consumer intelligence company that measures consumer purchasing and retail sales across markets, providing
  retail measurement, consumer panel, e-commerce, pricing and promotion, brand health and analytics solutions to consumer packaged goods manufacturers
  and retailers. Its website describes it as delivering "The Full View" of consumer intelligence; it is publicly listed, with investor relations
  at investors.nielseniq.com.

